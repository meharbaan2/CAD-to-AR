[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadconverter"
version = "0.1.0"
description = "Two-way STEP/GLB CAD conversion workbench with hierarchy export and mesh-to-STEP reconstruction."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CADLite" }
]
dependencies = [
    "numpy",
    "trimesh",
    "pygltflib"
]

[project.optional-dependencies]
dev = [
    "pytest"
]

[project.scripts]
cadconverter = "cadconverter.cli:main"

[tool.setuptools]
packages = ["cadconverter", "cadconverter.reverse"]

[tool.setuptools.package-data]
cadconverter = ["workbench.html"]
