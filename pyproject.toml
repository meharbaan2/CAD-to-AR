[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cadconverter"
version = "0.1.0"
description = "Hierarchy-preserving STEP to GLB converter for CAD assemblies."
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "CADLite" }
]
dependencies = [
    "numpy",
    "trimesh",
    "pygltflib"
]

[project.scripts]
cadconverter = "cadconverter.cli:main"

[tool.setuptools]
packages = ["cadconverter", "cadconverter.reverse"]

[tool.setuptools.package-data]
cadconverter = ["workbench.html"]
